# -----------------------------------------------
# Configuracion de base de datos (DESARROLLO)
# -----------------------------------------------
# Copia este archivo como application-dev.properties
# y completa con tus datos locales. NO subas credenciales reales al repo.
# -----------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/sbe_db
spring.datasource.username=postgres
spring.datasource.password=tu_password

# Mostrar SQL en consola solo en dev
spring.jpa.show-sql=true

# Recrear tablas en dev (cambiar a 'update' si no queres perder datos)
spring.jpa.hibernate.ddl-auto=create-drop

# -----------------------------------------------
# JWT (cambiar en prod)
# -----------------------------------------------
jwt.secret=dev-secret-key-cambiar-en-produccion
jwt.expiration-ms=86400000
